<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кофейня Менюі</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f8f9fa; color: #333; padding-bottom: 50px; }
        header { background-color: #2c221e; color: white; text-align: center; padding: 25px 15px; }
        header h1 { font-size: 24px; margin-bottom: 5px; }
        header p { font-size: 14px; color: #b0a499; }
        .container { max-width: 600px; margin: 20px auto; padding: 0 15px; }
        .category-title { font-size: 18px; font-weight: bold; margin: 20px 0 10px; color: #2c221e; border-left: 4px solid #c8963e; padding-left: 8px; }
        .menu-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        .menu-card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.06); cursor: pointer; transition: transform 0.2s; display: flex; flex-direction: column; }
        .menu-card:active { transform: scale(0.97); }
        .menu-card img { width: 100%; height: 120px; object-fit: cover; }
        .card-content { padding: 10px; display: flex; flex-direction: column; justify-content: space-between; flex-grow: 1; }
        .card-title { font-size: 14px; font-weight: 600; margin-bottom: 5px; color: #222; }
        .card-price { font-size: 14px; font-weight: bold; color: #c8963e; }

        /* Модальды терезе (Басқан кезде ашылатын жер) */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); justify-content: center; align-items: flex-end; z-index: 1000; }
        .modal-content { background: white; width: 100%; max-width: 600px; border-top-left-radius: 20px; border-top-right-radius: 20px; padding: 20px; max-height: 85vh; overflow-y: auto; animation: slideUp 0.3s ease-out; position: relative; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .close-btn { position: absolute; top: 15px; right: 15px; background: #eee; border: none; width: 30px; height: 30px; border-radius: 50%; font-size: 16px; cursor: pointer; font-weight: bold; }
        .modal-img { width: 100%; height: 220px; object-fit: cover; border-radius: 12px; margin-bottom: 15px; }
        .modal-title { font-size: 20px; font-weight: bold; margin-bottom: 8px; color: #222; }
        .modal-price { font-size: 18px; font-weight: bold; color: #c8963e; margin-bottom: 15px; }
        .modal-desc-title { font-size: 14px; font-weight: bold; margin-bottom: 5px; color: #555; }
        .modal-desc { font-size: 14px; color: #666; line-height: 1.5; margin-bottom: 20px; }
    </style>
</head>
<body>

    <header>
        <h1>☕ Кофейня Менюі</h1>
        <p>Тағамды көру үшін үстіне басыңыз</p>
    </header>

    <div class="container">
        <div class="category-title">Ыстық сусындар</div>
        <div class="menu-grid" id="menu-container">
            <!-- JavaScript арқылы автоматты толады -->
        </div>
    </div>

    <!-- Модальды терезе -->
    <div class="modal" id="itemModal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal()">✕</button>
            <img id="modalImg" class="modal-img" src="" alt="">
            <div id="modalTitle" class="modal-title"></div>
            <div id="modalPrice" class="modal-price"></div>
            <div class="modal-desc-title">Құрамы мен сипаттамасы:</div>
            <div id="modalDesc" class="modal-desc"></div>
        </div>
    </div>

    <script>
        const menuData = [
            {
                name: "Капучино",
                price: "1200 тг",
                img: "https://images.unsplash.com/photo-1572442388796-11668a67e53d?w=500",
                desc: "Классикалық итальян кофемәзірі. Қою эспрессо, ыстық сүт және жұмсақ сүт көбігінен тұрады."
            },
            {
                name: "Латте",
                price: "1400 тг",
                img: "https://images.unsplash.com/photo-1561882468-9110e5c16b38?w=500",
                desc: "Көп мөлшердегі сүт пен жұмсақ эспрессо үйлесімі. Кофені жұмсақ ұнататындар үшін тамаша таңдау."
            },
            {
                name: "Раф кофе",
                price: "1600 тг",
                img: "https://images.unsplash.com/photo-1541167760496-1628856ab772?w=500",
                desc: "Эспрессо, кілегей (сливки) және ваниль сиропы қосылып арнайы шайқалып дайындалатын тәтті сусын."
            },
            {
                name: "Эспрессо",
                price: "800 тг",
                img: "https://images.unsplash.com/photo-1510591509098-f4fdc6d0ff04?w=500",
                desc: "Қою әрі қуатты классикалық бір порциялы қара кофе."
            }
        ];

        const container = document.getElementById('menu-container');

        menuDataitem => {
            return `
                <div class="menu-card" onclick="openModal('${item.name}')">
                    <img src="${item.img}" alt="${item.name}">
                    <div class="card-content">
                        <div class="card-title">${item.name}</div>
                        <div class="card-price">${item.price}</div>
                    </div>
                </div>
            `;
        }).join('');

        function openModal(name) {
            const item = menuData.find(i => i.name === name);
            if (!item) return;
            document.getElementById('modalImg').src = item.img;
            document.getElementById('modalTitle').innerText = item.name;
            document.getElementById('modalPrice').innerText = item.price;
            document.getElementById('modalDesc').innerText = item.desc;
            document.getElementById('itemModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('itemModal').style.display = 'none';
        }

        window.onclick = function(event) {
            const modal = document.getElementById('itemModal');
            if (event.target === modal) {
                closeModal();
            }
        }
    </script>
</body>
</html>
